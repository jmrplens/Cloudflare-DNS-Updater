---
name: Lint & Validation

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validation Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint shfmt
      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run Validation Script
        run: |
          chmod +x tools/*.sh
          ./tools/validate.sh
        shell: bash

  identity-snapshot:
    name: Identity snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `docs/identity/person.snapshot.json` is the offline fallback for the canonical `#person`
      # node: the build fetches the live document and only falls back to this.
      # jmrplens/jmrp.io propagates it automatically whenever the canonical
      # changes, and this guard is what says so out loud if the two ever drift
      # apart — a stale snapshot is invisible while the fetch works, and ships
      # a Person missing several properties the moment it does not.
      - name: Snapshot matches the canonical document
        run: node docs/scripts/sync-identity.mjs --check
